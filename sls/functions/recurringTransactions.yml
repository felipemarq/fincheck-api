createRecurringTransaction:
  handler: src/main/functions/recurringTransactions/createRecurringTransaction.handler
  events:
    - httpApi:
        path: /recurring-transactions
        method: POST
        authorizer:
          name: CognitoAuthorizer

listRecurringTransactions:
  handler: src/main/functions/recurringTransactions/listRecurringTransactions.handler
  events:
    - httpApi:
        path: /recurring-transactions
        method: GET
        authorizer:
          name: CognitoAuthorizer

updateRecurringTransaction:
  handler: src/main/functions/recurringTransactions/updateRecurringTransaction.handler
  events:
    - httpApi:
        path: /recurring-transactions/{recurringTransactionId}
        method: PATCH
        authorizer:
          name: CognitoAuthorizer

deleteRecurringTransaction:
  handler: src/main/functions/recurringTransactions/deleteRecurringTransaction.handler
  events:
    - httpApi:
        path: /recurring-transactions/{recurringTransactionId}/{entityId}
        method: DELETE
        authorizer:
          name: CognitoAuthorizer

recurringMaterializeDaily:
  handler: src/main/functions/recurringTransactions/materializeDaily.handler
  timeout: 30
  events:
    - eventBridge:
        schedule: cron(0 3 * * ? *) # 03:00 UTC, 1x/dia
