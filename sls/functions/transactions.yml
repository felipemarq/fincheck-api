createTransaction:
  handler: src/main/functions/transactions/createTransaction.handler
  events:
    - httpApi:
        path: /transactions
        method: POST
        authorizer:
          name: CognitoAuthorizer

listTransactions:
  handler: src/main/functions/transactions/listTransactions.handler
  events:
    - httpApi:
        path: /transactions
        method: GET
        authorizer:
          name: CognitoAuthorizer

updateTransaction:
  handler: src/main/functions/transactions/updateTransaction.handler
  events:
    - httpApi:
        path: /transactions/{transactionId}
        method: PATCH
        authorizer:
          name: CognitoAuthorizer

deleteTransaction:
  handler: src/main/functions/transactions/deleteTransaction.handler
  events:
    - httpApi:
        path: /transactions/{transactionId}/{entityId}
        method: DELETE
        authorizer:
          name: CognitoAuthorizer
