createCreditCard:
  handler: src/main/functions/creditCards/createCreditCard.handler
  events:
    - httpApi:
        path: /entities/{entityId}/credit-cards
        method: POST
        authorizer:
          name: CognitoAuthorizer

listCreditCards:
  handler: src/main/functions/creditCards/listCreditCards.handler
  events:
    - httpApi:
        path: /entities/{entityId}/credit-cards
        method: GET
        authorizer:
          name: CognitoAuthorizer

updateCreditCard:
  handler: src/main/functions/creditCards/updateCreditCard.handler
  events:
    - httpApi:
        path: /entities/{entityId}/credit-cards/{creditCardId}
        method: PATCH
        authorizer:
          name: CognitoAuthorizer
