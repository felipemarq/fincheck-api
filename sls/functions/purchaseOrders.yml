createPurchaseOrder:
  handler: src/main/functions/purchaseOrders/createPurchaseOrder.handler
  memorySize: 512
  timeout: 20
  events:
    - httpApi:
        path: /entities/{entityId}/purchase-orders
        method: POST
        authorizer:
          name: CognitoAuthorizer

listPurchaseOrders:
  handler: src/main/functions/purchaseOrders/listPurchaseOrders.handler
  memorySize: 512
  events:
    - httpApi:
        path: /entities/{entityId}/purchase-orders
        method: GET
        authorizer:
          name: CognitoAuthorizer

listPurchaseOrderItems:
  handler: src/main/functions/purchaseOrders/listPurchaseOrderItems.handler
  memorySize: 512
  timeout: 15
  events:
    - httpApi:
        path: /entities/{entityId}/purchase-order-items
        method: GET
        authorizer:
          name: CognitoAuthorizer

getPurchaseOrder:
  handler: src/main/functions/purchaseOrders/getPurchaseOrder.handler
  memorySize: 512
  events:
    - httpApi:
        path: /entities/{entityId}/purchase-orders/{purchaseOrderId}
        method: GET
        authorizer:
          name: CognitoAuthorizer

updatePurchaseOrder:
  handler: src/main/functions/purchaseOrders/updatePurchaseOrder.handler
  memorySize: 512
  timeout: 20
  events:
    - httpApi:
        path: /entities/{entityId}/purchase-orders/{purchaseOrderId}
        method: PATCH
        authorizer:
          name: CognitoAuthorizer
