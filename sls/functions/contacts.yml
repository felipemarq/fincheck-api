createContact:
  handler: src/main/functions/contacts/createContact.handler
  events:
    - httpApi:
        path: /entities/{entityId}/contacts
        method: POST
        authorizer:
          name: CognitoAuthorizer

listContacts:
  handler: src/main/functions/contacts/listContacts.handler
  events:
    - httpApi:
        path: /entities/{entityId}/contacts
        method: GET
        authorizer:
          name: CognitoAuthorizer

updateContact:
  handler: src/main/functions/contacts/updateContact.handler
  events:
    - httpApi:
        path: /entities/{entityId}/contacts/{contactId}
        method: PATCH
        authorizer:
          name: CognitoAuthorizer

deleteContact:
  handler: src/main/functions/contacts/deleteContact.handler
  events:
    - httpApi:
        path: /entities/{entityId}/contacts/{contactId}
        method: DELETE
        authorizer:
          name: CognitoAuthorizer
