createAccount:
  handler: src/main/functions/accounts/createAccount.handler
  events:
    - httpApi:
        path: /accounts
        method: POST
        authorizer:
          name: CognitoAuthorizer

listAccounts:
  handler: src/main/functions/accounts/listAccounts.handler
  events:
    - httpApi:
        method: GET
        path: /entities/{entityId}/accounts
        authorizer:
          name: CognitoAuthorizer

updateAccount:
  handler: src/main/functions/accounts/updateAccount.handler
  events:
    - httpApi:
        method: PATCH
        path: /entities/{entityId}/accounts/{accountId}
        authorizer:
          name: CognitoAuthorizer

deleteAccount:
  handler: src/main/functions/accounts/deleteAccount.handler
  events:
    - httpApi:
        method: DELETE
        path: /entities/{entityId}/accounts/{accountId}
        authorizer:
          name: CognitoAuthorizer
