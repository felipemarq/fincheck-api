createInvoice:
  handler: src/main/functions/invoices/createInvoice.handler
  memorySize: 512
  events:
    - httpApi:
        path: /entities/{entityId}/purchase-orders/{purchaseOrderId}/invoices
        method: POST
        authorizer:
          name: CognitoAuthorizer

listInvoices:
  handler: src/main/functions/invoices/listInvoices.handler
  memorySize: 512
  events:
    - httpApi:
        path: /entities/{entityId}/purchase-orders/{purchaseOrderId}/invoices
        method: GET
        authorizer:
          name: CognitoAuthorizer

updateInvoice:
  handler: src/main/functions/invoices/updateInvoice.handler
  memorySize: 512
  events:
    - httpApi:
        path: /entities/{entityId}/purchase-orders/{purchaseOrderId}/invoices/{invoiceId}
        method: PATCH
        authorizer:
          name: CognitoAuthorizer

createReceivablePayment:
  handler: src/main/functions/invoices/createReceivablePayment.handler
  memorySize: 512
  events:
    - httpApi:
        path: /entities/{entityId}/purchase-orders/{purchaseOrderId}/invoices/{invoiceId}/payments
        method: POST
        authorizer:
          name: CognitoAuthorizer

updateReceivablePayment:
  handler: src/main/functions/invoices/updateReceivablePayment.handler
  memorySize: 512
  events:
    - httpApi:
        path: /entities/{entityId}/purchase-orders/{purchaseOrderId}/invoices/{invoiceId}/payments/{paymentId}
        method: PATCH
        authorizer:
          name: CognitoAuthorizer
