Resources:
  QuotationImagesBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: ${self:custom.quotationImagesBucket}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "*"
            AllowedMethods:
              - GET
              - HEAD
            AllowedOrigins:
              - http://localhost:5173
              - http://127.0.0.1:5173
              - http://localhost:5174
              - http://127.0.0.1:5174
              - https://app.moneystack.com.br
            ExposedHeaders:
              - ETag
            MaxAge: 900

Outputs:
  QuotationImagesBucketName:
    Value: !Ref QuotationImagesBucket
