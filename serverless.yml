# "org" ensures this Service is used with the correct Serverless Framework Access Key.
org: felipebrody10
# "service" is the name of this project. This will also be added to your AWS resource names.
service: fincheck-api

provider:
  name: aws
  region: sa-east-1
  runtime: nodejs22.x
  memorySize: 256
  stage: ${opt:stage, 'dev'}
  environment: ${file(./sls/config/env.yml)}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - s3:GetObject
            - s3:PutObject
            - s3:DeleteObject
          Resource: arn:aws:s3:::${self:custom.quotationImagesBucket}/*
  httpApi:
    disableDefaultEndpoint: ${env:DISABLE_DEFAULT_APIGW_ENDPOINT, false}
    authorizers:
      CognitoAuthorizer:
        type: jwt
        identitySource: $request.header.Authorization
        issuerUrl: !GetAtt UserPool.ProviderURL
        audience:
          - !Ref UserPoolClient
    cors:
      allowedOrigins:
        - http://localhost:5173 # Vite
        - http://127.0.0.1:5173
        - http://localhost:5174 # Compatibilidade com sessoes Vite ja abertas
        - http://127.0.0.1:5174
        - https://app.moneystack.com.br
      allowedHeaders:
        - Content-Type
        - Authorization
        - X-Requested-With
        - x-idempotency-key
      allowedMethods:
        - OPTIONS
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
      allowCredentials: false
      maxAge: 600

package:
  individually: true

custom:
  cognito:
    PoolName: ${self:service}-${self:provider.stage}-UserPool
  quotationImagesBucket: ${self:service}-${self:provider.stage}-${aws:accountId}-quotation-images

build:
  esbuild:
    configFile: ./esbuild.config.mjs

functions:
  - ${file(./sls/functions/auth.yml)}
  - ${file(./sls/functions/customers.yml)}
  - ${file(./sls/functions/products.yml)}
  - ${file(./sls/functions/quotations.yml)}
  - ${file(./sls/functions/purchaseOrders.yml)}
  - ${file(./sls/functions/acquisitions.yml)}
  - ${file(./sls/functions/creditCards.yml)}
  - ${file(./sls/functions/payables.yml)}
  - ${file(./sls/functions/receipts.yml)}
  - ${file(./sls/functions/deliveries.yml)}
  - ${file(./sls/functions/invoices.yml)}
  - ${file(./sls/functions/operationsDashboard.yml)}
  - ${file(./sls/functions/entities.yml)}
  - ${file(./sls/functions/users.yml)}
  - ${file(./sls/functions/bodyWeights.yml)}

resources:
  - ${file(./sls/resources/UserPool.yml)}
  - ${file(./sls/resources/APIGWCustomDomain.yml)}
  - ${file(./sls/resources/QuotationImagesBucket.yml)}
